# Local test Postgres for ato-expiry-automation. Fake data only, local only.
# Usage: from db/, run `docker compose up -d`
services:
  stockdb:
    image: postgres:16
    container_name: stockdb
    environment:
      POSTGRES_DB: stock
      # Local test database only -- never used outside this machine.
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
